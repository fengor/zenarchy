name: Build Packages and Publish Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: google-github-actions/release-please-action@v4

  build-and-deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Pacman & Install Build Tools
        run: |
          pacman -Syu --noconfirm git pacman-contrib

      - name: Setup Unprivileged Build User
        run: |
          mkdir -p output/x86_64
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w/zenarchy/zenarchy

      - name: Build Packages
        run: |
          cd pkgs
          for pkg in */; do
            echo "Building package: $pkg"
            cd "$pkg"
            sudo -u builder makepkg -s -d --noconfirm --skippgpcheck
            mv *.pkg.tar.zst ../../output/x86_64/
            cd ..
          done

      - name: Create Pacman Repository Database
        run: |
          cd output/x86_64
          repo-add zenarchy.db.tar.gz *.pkg.tar.zst

      - name: Copy Documentation to Output Root
        run: |
          # Copy your markdown documentation into the root of the site output
          mkdir -p output/docs
          cp -r docs/* output/

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: [release-please, build-and-deploy]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
